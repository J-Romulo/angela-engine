<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Angela — a chess engine written from scratch in TypeScript">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161f"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b44a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e8b44a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e8b44a" stop-opacity="0"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b44a"/>
    </marker>
  </defs>

  <rect width="1000" height="280" rx="10" fill="url(#bg)"/>
  <rect x="0" y="0" width="3" height="280" fill="url(#edge)"/>

  <!-- Tabuleiro: 8x8 de 26px a partir de (56, 36). -->
  <g>
    <rect x="56" y="36" width="208" height="208" fill="#151b25"/>
    <g fill="#2b3648">
      <rect x="82"  y="36"  width="26" height="26"/><rect x="134" y="36"  width="26" height="26"/><rect x="186" y="36"  width="26" height="26"/><rect x="238" y="36"  width="26" height="26"/>
      <rect x="56"  y="62"  width="26" height="26"/><rect x="108" y="62"  width="26" height="26"/><rect x="160" y="62"  width="26" height="26"/><rect x="212" y="62"  width="26" height="26"/>
      <rect x="82"  y="88"  width="26" height="26"/><rect x="134" y="88"  width="26" height="26"/><rect x="186" y="88"  width="26" height="26"/><rect x="238" y="88"  width="26" height="26"/>
      <rect x="56"  y="114" width="26" height="26"/><rect x="108" y="114" width="26" height="26"/><rect x="160" y="114" width="26" height="26"/><rect x="212" y="114" width="26" height="26"/>
      <rect x="82"  y="140" width="26" height="26"/><rect x="134" y="140" width="26" height="26"/><rect x="186" y="140" width="26" height="26"/><rect x="238" y="140" width="26" height="26"/>
      <rect x="56"  y="166" width="26" height="26"/><rect x="108" y="166" width="26" height="26"/><rect x="160" y="166" width="26" height="26"/><rect x="212" y="166" width="26" height="26"/>
      <rect x="82"  y="192" width="26" height="26"/><rect x="134" y="192" width="26" height="26"/><rect x="186" y="192" width="26" height="26"/><rect x="238" y="192" width="26" height="26"/>
      <rect x="56"  y="218" width="26" height="26"/><rect x="108" y="218" width="26" height="26"/><rect x="160" y="218" width="26" height="26"/><rect x="212" y="218" width="26" height="26"/>
    </g>

    <!-- Casas de origem e destino do lance. -->
    <rect x="82" y="192" width="26" height="26" fill="#e8b44a" opacity=".16"/>
    <rect x="134" y="140" width="26" height="26" fill="#e8b44a" opacity=".28"/>

    <!-- Salto do cavalo: duas casas e uma. -->
    <path d="M95 205 L95 153 L134 153" fill="none" stroke="#e8b44a" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)" opacity=".95"/>
    <circle cx="95" cy="205" r="4.5" fill="#e8b44a"/>

    <rect x="56" y="36" width="208" height="208" fill="none" stroke="#2c3646" stroke-width="1.5"/>
  </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="324" y="126" font-size="84" fill="#f2f5fa" letter-spacing="1">Angela<tspan font-size="50" dx="22">🪽</tspan></text>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="327" y="168" font-size="25" fill="#93a0b4">A chess engine written from scratch in TypeScript.</text>
    <text x="327" y="211" font-size="16" fill="#e8b44a" letter-spacing="2.4" opacity=".92">UCI · ALPHA-BETA · NO CHESS LIBRARIES</text>
  </g>
</svg>
